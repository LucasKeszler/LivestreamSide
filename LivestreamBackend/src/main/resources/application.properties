spring.application.name=LivestreamBackend

# --- Database (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/folkemoedet_videoer?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Testdata (data.sql) ---
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- Company details (footer, terms and privacy pages) ---
# Fill in the real details before the site goes live.
company.name=[Virksomhedens navn]
company.cvr=[CVR-nummer]
company.address=[Adresse]
company.email=[Kontakt-e-mail]
